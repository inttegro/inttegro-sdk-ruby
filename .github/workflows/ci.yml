name: Ruby SDK CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      INTTEGRO_OPENAPI_SPEC: openapi/commerce.yml
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "3.1", "3.2", "3.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout OpenAPI contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: inttegro/openapi
          ref: a5c03e0137fb20f0883087e91afa4231f26c54f9
          path: openapi
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "2.5.23"
          bundler-cache: true

      - name: Run tests
        run: COVERAGE=1 bundle exec rake test

      - name: Run Sorbet
        run: bundle exec rake sorbet

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          file: coverage/.resultset.json
          flags: ruby
          name: ruby-sdk
