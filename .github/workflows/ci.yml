name: Ruby SDK CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      INTTEGRO_OPENAPI_SPEC: openapi/commerce.yml
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "3.1", "3.2", "3.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout OpenAPI contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: inttegro/openapi
          ref: 219e0091356e1ecec48cf8587360edcbf21de03b
          path: openapi
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "2.5.23"
          bundler-cache: true

      - name: Run tests
        run: COVERAGE=1 bundle exec rake test

      - name: Run Sorbet
        run: bundle exec rake sorbet

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: coverage/.resultset.json
          flags: ruby
          name: ruby-sdk
